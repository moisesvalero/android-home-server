# ==============================================================================
# MiniDLNA Configuration - Android Home Server
# Optimizado para streaming local en Smart TVs (Samsung Tizen, LG webOS, Android TV)
# ==============================================================================

# Puerto para el protocolo DLNA/UPnP
port=8200

# Directorios de medios multimedia ('V' para vídeos)
media_dir=V,/data/data/com.termux/files/home/media/peliculas
media_dir=V,/data/data/com.termux/files/home/media/series

# Nombre visible en la Smart TV (aparece en Fuentes / Dispositivos Conectados)
friendly_name=Android Media Server

# Rutas para base de datos y logs
db_dir=/data/data/com.termux/files/home/.config/minidlna/cache
log_dir=/data/data/com.termux/files/home/.config/minidlna/log

# Detección automática en tiempo real de nuevos archivos (inotify)
inotify=yes

# Nombres reconocidos como carátula/póster
album_art_names=Cover.jpg/cover.jpg/Poster.jpg/poster.jpg/Folder.jpg/folder.jpg/AlbumArt.jpg/albumart.jpg

# Compatibilidad con Smart TVs modernas
strict_dlna=no
enable_tivo=no

# Frecuencia de anuncio en la red (segundos)
notify_interval=60

serial=1001
model_number=1
